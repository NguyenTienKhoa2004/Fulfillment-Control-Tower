name: netcom

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: netcom
      POSTGRES_PASSWORD: netcom_local
      POSTGRES_DB: netcom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netcom -d netcom"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-netcom_admin_local}
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping')"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env.example
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://netcom:netcom_local@db:5432/netcom
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "app.migrate"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env.example
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://netcom:netcom_local@db:5432/netcom
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "app.seed"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env.example
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://netcom:netcom_local@db:5432/netcom
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - path: frontend/.env.example
      - path: frontend/.env
        required: false
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
